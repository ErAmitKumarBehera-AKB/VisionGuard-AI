global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "bentoml-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["bentoml:3000", "host.docker.internal:3000", "localhost:3000"]

  - job_name: "mlflow-server"
    static_configs:
      - targets: ["mlflow:5000"]
