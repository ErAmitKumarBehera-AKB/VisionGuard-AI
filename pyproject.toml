[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "manufacturing-quality-inspection"
version = "1.0.0"
description = "TCS Industry-Aligned Capstone: Visual Quality Inspection System for Manufacturing"
authors = [
    { name = "ML Engineering Team", email = "ml-team@tcs-inspection.internal" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Manufacturing",
]
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "numpy>=1.24.0,<2.0.0",
    "pillow>=10.0.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "mlflow>=2.10.0",
    "dvc>=3.40.0",
    "bentoml>=1.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "streamlit>=1.32.0",
    "prometheus-client>=0.20.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "tqdm>=4.66.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "black>=24.0.0",
]

[tool.pytest.ini_options]
testpaths = ["ml/tests", "backend/tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
pythonpath = [".", "ml/src", "backend/app"]

[tool.ruff]
line-length = 100
target-version = "py311"
