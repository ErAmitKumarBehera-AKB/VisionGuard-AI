edge_device:
  device_id: "rpi5-inspection-node-01"
  location: "Conveyor-Line-A"
  architecture: "aarch64"
  ram_mb: 8192

camera:
  mode: "opencv"
  device_index: 0
  resolution: [640, 480]
  fps: 30
  mock_synthetic_dir: "training/data/raw/mvtec/metal_nut/test"

hardware_trigger:
  mode: "simulation"
  photoelectric_pin: 24
  trigger_interval_seconds: 3.0
  debounce_ms: 50

rejection_mechanism:
  mode: "simulation"
  actuator_pin: 18
  pulse_duration_seconds: 0.2
  ejection_delay_ms: 150

model_service:
  endpoint_url: "http://localhost:3000/predict"
  local_fallback: true
  confidence_threshold: 0.85
