networks:
  inspection-net:
    driver: bridge

volumes:
  sqlite_data:
  mongodb_data:
  prometheus_data:
  grafana_data:

services:
  mongodb:
    image: mongo:7.0
    container_name: mfg_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: visioninspect
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand({ ping: 1 }).ok\" | grep -q 1"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 10
    networks:
      - inspection-net

  serving:
    build:
      context: .
      dockerfile: serving/Dockerfile
    container_name: mfg_bentoml_serving
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - MODEL_CHECKPOINT_PATH=/app/ml/artifacts/checkpoints/best_model_384.pt
      - DEFECT_THRESHOLD=0.50
      - MODEL_IMAGE_SIZE=384
      - DEVICE=${MODEL_DEVICE:-cpu}
      - OMP_NUM_THREADS=${MODEL_THREADS:-1}
      - MKL_NUM_THREADS=${MODEL_THREADS:-1}
    volumes:
      - ./ml/artifacts/checkpoints:/app/ml/artifacts/checkpoints:ro
    mem_limit: 3g
    cpus: 2.0
    networks:
      - inspection-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mfg_fastapi_backend
    restart: unless-stopped
    depends_on:
      serving:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - BENTOML_SERVICE_URL=http://serving:3000
      - DATABASE_URL=sqlite:////app/data/inspection.db
      - MONGO_URI=mongodb://mongodb:27017/visioninspect
      - MONGO_DB=visioninspect
      - IMAGE_STORAGE_PATH=/app/data/images
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env before starting the backend}
      - ALLOW_IN_PROCESS_FALLBACK=false
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-}
      - ENVIRONMENT=production
    volumes:
      - sqlite_data:/app/data
      - ./ml/artifacts/checkpoints:/app/ml/artifacts/checkpoints:ro
    mem_limit: 1g
    cpus: 1.0
    networks:
      - inspection-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: mfg_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8089:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    mem_limit: 256m
    cpus: 0.5
    networks:
      - inspection-net

  qc:
    profiles: ["ops"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mfg_streamlit_qc
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8501:8501"
    environment:
      - BACKEND_API_URL=http://backend:8000
    command: ["streamlit", "run", "qc/app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    volumes:
      - ./backend/app/storage:/app/backend/app/storage:ro
    networks:
      - inspection-net

  prometheus:
    profiles: ["ops"]
    image: prom/prometheus:v2.50.1
    container_name: mfg_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    networks:
      - inspection-net

  grafana:
    profiles: ["ops"]
    image: grafana/grafana:10.3.3
    container_name: mfg_grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - inspection-net
