version: "3.8"

services:
  bentoml:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bentoml_service
    platform: linux/amd64
    ports:
      - "3000:3000"
    volumes:
      - ./models:/app/models
      - ./mlruns:/app/mlruns
    restart: always

  mlflow:
    image: python:3.10-slim
    container_name: mlflow_service
    working_dir: /mlflow
    command: >
      bash -lc "pip install mlflow && mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts"
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlflow
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_service
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_service
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    restart: always

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: streamlit_service
    command: >
      bash -lc "streamlit run src/app.py --server.port 8501 --server.address 0.0.0.0"
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    restart: always
